[package]
name = "canvas-assistant"
version = "0.1.0"
description = "Personal Windows Canvas LMS assistant with Codex"
authors = ["sopo9880"]
edition = "2021"

[lib]
name = "canvas_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
